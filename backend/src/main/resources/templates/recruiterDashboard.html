<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>HR Recruiter Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
        }
        h1 {
            color: #1976d2;
            text-align: center;
            margin-bottom: 30px;
        }
        .card-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 300px;
            border: 2px solid #1976d2;
            padding: 20px;
            border-radius: 5px;
        }
        .card h2 {
            color: #1976d2;
            margin-top: 0;
        }
        .card p {
            color: #555;
            margin: 15px 0;
        }
        .button {
            display: inline-block;
            background-color: #1976d2;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin: 5px;
        }
        .button:hover {
            background-color: #1565c0;
        }
        .stats {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            text-align: center;
        }
        .stats .count {
            font-size: 24px;
            color: #1976d2;
            font-weight: bold;
        }
        .stats .label {
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HR Recruiter Dashboard</h1>
        <div class="card-container">
            <div class="card">
                <h2>Candidate Management</h2>
                <p>Add new candidates and manage existing applications.</p>
                <a href="/candidateForm" class="button">Add Candidate</a>
                <a href="/candidates/list" class="button">View All Candidates</a>
                <div class="stats">
                    <div class="count" th:text="${candidateCount != null ? candidateCount : 0}">0</div>
                    <div class="label">Total Candidates</div>
                </div>
            </div>

            <div class="card">
                <h2>Job Requisitions</h2>
                <p>Create new job requisitions and manage open positions.</p>
                <a href="/jobRequisition/form" class="button">Create Requisition</a>
                <a href="/jobRequisition/list" class="button">View All Requisitions</a>
                <div class="stats">
                    <div class="count" th:text="${requisitionCount != null ? requisitionCount : 0}">0</div>
                    <div class="label">Total Requisitions</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
