<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Leave History</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Table Wrapper for horizontal scrolling on smaller screens */
        .table-container {
            width: 100%;
            max-width: 850px;
            margin-bottom: 25px;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #ffffff;
            border: none;
        }

        th, td {
            padding: 14px 20px;
            text-align: left;
            white-space: nowrap;
        }

        thead {
            background-color: #2c3e50;
            color: #ffffff;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr:hover {
            background-color: #edf2f7;
        }

        td {
            font-size: 14px;
            color: #4a5568;
        }

        /* Dynamic Status Badges */
        .status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            display: inline-block;
            text-align: center;
            min-width: 80px;
        }

        /* Fallback color if Thymeleaf exact match text styling is handled purely by layout */
        .status {
            background-color: #e2e8f0;
            color: #4a5568;
        }

        /* Back Button Container */
        .actions {
            width: 100%;
            max-width: 850px;
            display: flex;
            justify-content: flex-start;
        }

        a {
            text-decoration: none;
        }

        .btn-back {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: #616a6b;
        }
    </style>
</head>
<body>

<h2>Leave Request History</h2>

<div class="table-container">
    <table border="0">
        <thead>
        <tr>
            <th>Leave ID</th>
            <th>From Date</th>
            <th>To Date</th>
            <th>Leave Type</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leave : ${history}">
            <td th:text="${leave.leaveId}"></td>
            <td th:text="${leave.fromDate}"></td>
            <td th:text="${leave.toDate}"></td>
            <td th:text="${leave.leaveType}"></td>
            <td>
                <span class="status" th:text="${leave.status}"></span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="actions">
    <a th:href="@{/leave/apply}">
        <button type="button" class="btn-back">Back</button>
    </a>
</div>

</body>
</html>
