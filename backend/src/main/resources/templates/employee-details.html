<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Details — HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2><i class="bi bi-person-badge"></i> Employee Details</h2>
    <hr>

    <div class="row mb-3">
        <div class="col-md-6"><label class="form-label">Employee ID</label><p th:text="${employee.id}"></p></div>
        <div class="col-md-6"><label class="form-label">Full Name</label><p th:text="${employee.name}"></p></div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6"><label class="form-label">Role / Designation</label><p th:text="${employee.role}"></p></div>
        <div class="col-md-6"><label class="form-label">Department</label><p th:text="${employee.department}"></p></div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6"><label class="form-label">Salary</label><p th:text="${employee.salary}"></p></div>
        <div class="col-md-6"><label class="form-label">Hire Date</label><p th:text="${employee.hireDate}"></p></div>
    </div>

    <div class="mt-4">
        <a th:href="@{/employees/dashboard}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>
</body>
</html>
