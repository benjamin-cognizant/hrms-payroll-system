<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Candidates List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
        }
        h2 {
            color: #1976d2;
            margin-top: 0;
        }
        .header-section {
            margin-bottom: 20px;
        }
        .button {
            display: inline-block;
            background-color: #1976d2;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            margin-right: 5px;
            border: none;
            cursor: pointer;
        }
        .button:hover {
            background-color: #1565c0;
        }
        .button-small {
            padding: 5px 10px;
            font-size: 14px;
        }
        .button-delete {
            background-color: #d32f2f;
        }
        .button-delete:hover {
            background-color: #c62828;
        }
        .message {
            background-color: #c8e6c9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #1976d2;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .no-data {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <h2>Candidates List</h2>
            <a href="/recruiter/dashboard" class="button">Back to Dashboard</a>
            <a href="/candidateForm" class="button">Add New Candidate</a>
        </div>
        <div th:if="${message}" class="message">
            <p th:text="${message}" style="margin: 0;"></p>
        </div>

        <table th:if="${candidates != null and !candidates.isEmpty()}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Applied Role</th>
                    <th>Experience (Years)</th>
                    <th>Interview Stage</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="candidate : ${candidates}">
                    <td th:text="${candidate.candidateId}"></td>
                    <td th:text="${candidate.fullName}"></td>
                    <td th:text="${candidate.appliedRole}"></td>
                    <td th:text="${candidate.experienceYears}"></td>
                    <td th:text="${candidate.interviewStage}"></td>
                    <td th:text="${#strings.replace(candidate.candidateStatus, '_', ' ')}"></td>
                    <td>
                        <a th:href="@{/candidates/edit/{id}(id=${candidate.candidateId})}" class="button button-small">Edit</a>
                        <a th:href="@{/candidates/delete/{id}(id=${candidate.candidateId})}"
                           th:data-name="${candidate.fullName}"
                           onclick="return confirm('Are you sure you want to delete candidate: ' + this.getAttribute('data-name') + '?')"
                           class="button button-small button-delete">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${candidates == null or candidates.isEmpty()}" class="no-data">
            <p>No candidates found. Click "Add New Candidate" to add one.</p>
        </div>
    </div>
</body>
</html>
