<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>HRMS - Appraisal Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1E3A8A !important;
        }
        .bg-custom-blue-header {
            background-color: #0F172A !important;
            color: #ffffff;
        }
        .btn-custom-blue {
            background-color: #2563EB !important;
            border-color: #2563EB !important;
            color: white;
        }
        .btn-custom-blue:hover {
            background-color: #1D4ED8 !important;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-custom-blue-header text-white">
            <h3 class="card-title mb-0">Performance Appraisal Dashboard</h3>
        </div>
        <div class="card-body">
            <p class="text-muted">Initialize a new appraisal cycle or access an existing record for an employee.</p>
            
            <form th:action="@{/appraisal/setGoals}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="employeeId" class="form-label">Employee ID</label>
                    <input type="number" class="form-control" id="employeeId" name="employeeId" placeholder="e.g., 101" required>
                </div>
                <div class="col-md-6">
                    <label for="appraisalCycle" class="form-label">Appraisal Cycle</label>
                    <select class="form-select" id="appraisalCycle" name="appraisalCycle" required>
                        <option value="">Choose Cycle...</option>
                        <option value="2025-H1">2025 - First Half (H1)</option>
                        <option value="2025-H2">2025 - Second Half (H2)</option>
                        <option value="2026-H1">2026 - First Half (H1)</option>
                    </select>
                </div>
                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-custom-blue">Initialize / Open Appraisal</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
