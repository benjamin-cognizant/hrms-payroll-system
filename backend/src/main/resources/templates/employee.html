<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard — HRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2><i class="bi bi-speedometer2"></i> Employee Dashboard</h2>
    <p>Enter employee details below:</p>
    <hr>

    <form th:action="@{/employees/createEmployee}" th:object="${employee}" method="post">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Role / Designation</label>
            <input type="text" class="form-control" th:field="*{role}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <input type="text" class="form-control" th:field="*{department}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Salary</label>
            <input type="number" class="form-control" th:field="*{salary}" min="0" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Hire Date</label>
            <input type="date" class="form-control" th:field="*{hireDate}" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Employee</button>
    </form>
</div>
</body>
</html>
