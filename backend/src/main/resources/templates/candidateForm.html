<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Candidate Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
        }
        h2 {
            color: #1976d2;
            text-align: center;
            margin-top: 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .required {
            color: red;
        }
        .button {
            width: 100%;
            background-color: #1976d2;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #1565c0;
        }
        .button-secondary {
            background-color: #757575;
            margin-top: 10px;
        }
        .button-secondary:hover {
            background-color: #616161;
        }
        .message {
            background-color: #c8e6c9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 th:text="${candidate != null and candidate.candidateId != null ? 'Edit Candidate' : 'Add Candidate'}">Add Candidate</h2>

        <div th:if="${message}" class="message">
            <p th:text="${message}" style="margin: 0;"></p>
        </div>

        <form th:action="@{/candidateForm}" th:object="${candidate}" method="post">
            <input type="hidden" th:field="*{candidateId}">

            <label>Full Name: <span class="required">*</span></label>
            <input type="text" th:field="*{fullName}" required placeholder="Enter full name">
            <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>

            <label>Applied Role: <span class="required">*</span></label>
            <input type="text" th:field="*{appliedRole}" required placeholder="e.g., Software Engineer">
            <span class="error" th:if="${#fields.hasErrors('appliedRole')}" th:errors="*{appliedRole}"></span>

            <label>Experience (Years): <span class="required">*</span></label>
            <input type="number" th:field="*{experienceYears}" min="0" max="50" required placeholder="Enter years of experience">
            <span class="error" th:if="${#fields.hasErrors('experienceYears')}" th:errors="*{experienceYears}"></span>

            <label>Interview Stage: <span class="required">*</span></label>
            <input type="text" th:field="*{interviewStage}" required placeholder="e.g., Initial Screening, Technical Round">
            <span class="error" th:if="${#fields.hasErrors('interviewStage')}" th:errors="*{interviewStage}"></span>

            <label>Status: <span class="required">*</span></label>
            <select th:field="*{candidateStatus}" required>
                <option value="">-- Select Status --</option>
                <option value="APPLIED">APPLIED</option>
                <option value="IN_INTERVIEW">IN_INTERVIEW</option>
                <option value="OFFERED">OFFERED</option>
                <option value="HIRED">HIRED</option>
                <option value="REJECTED">REJECTED</option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('candidateStatus')}" th:errors="*{candidateStatus}"></span>

            <button type="submit" class="button">Submit</button>
        </form>

        <a href="/candidates/list" style="text-decoration: none;">
            <button class="button button-secondary">View Candidates List</button>
        </a>
        <a href="/recruiter/dashboard" style="text-decoration: none;">
            <button class="button button-secondary">Back to Dashboard</button>
        </a>
    </div>
</body>
</html>
