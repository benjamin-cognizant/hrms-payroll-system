<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Requisition Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3f2fd;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 5px;
        }
        h2 {
            color: #1976d2;
            text-align: center;
            margin-top: 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        .required {
            color: red;
        }
        .button {
            width: 100%;
            background-color: #1976d2;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #1565c0;
        }
        .button-secondary {
            background-color: #757575;
            margin-top: 10px;
        }
        .button-secondary:hover {
            background-color: #616161;
        }
        .message {
            background-color: #c8e6c9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 th:text="${jobRequisition != null and jobRequisition.requisitionId != null ? 'Edit Job Requisition' : 'Create Job Requisition'}">Create Job Requisition</h2>
        <div th:if="${message}" class="message">
            <p th:text="${message}" style="margin: 0;"></p>
        </div>

        <form th:action="@{/jobRequisition/create}" th:object="${jobRequisition}" method="post">
            <input type="hidden" th:field="*{requisitionId}">

            <label>Job Title: <span class="required">*</span></label>
            <input type="text" th:field="*{jobTitle}" required placeholder="e.g., Senior Software Engineer">
            <span class="error" th:if="${#fields.hasErrors('jobTitle')}" th:errors="*{jobTitle}"></span>

            <label>Department: <span class="required">*</span></label>
            <input type="text" th:field="*{department}" required placeholder="e.g., IT, HR, Finance">
            <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>

            <label>Number of Positions: <span class="required">*</span></label>
            <input type="number" th:field="*{numberOfPositions}" min="1" max="100" required placeholder="Enter number">
            <span class="error" th:if="${#fields.hasErrors('numberOfPositions')}" th:errors="*{numberOfPositions}"></span>

            <label>Priority: <span class="required">*</span></label>
            <select th:field="*{priority}" required>
                <option value="">-- Select Priority --</option>
                <option value="LOW">Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
                <option value="URGENT">Urgent</option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}"></span>

            <label>Status: <span class="required">*</span></label>
            <select th:field="*{status}" required>
                <option value="">-- Select Status --</option>
                <option value="OPEN">Open</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="FILLED">Filled</option>
                <option value="CLOSED">Closed</option>
            </select>
            <span class="error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>

            <label>Description:</label>
            <textarea th:field="*{description}" maxlength="2000" placeholder="Enter job description (max 2000 characters)"></textarea>
            <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>

            <label>Requisition Date: <span class="required">*</span></label>
            <input type="date" th:field="*{requisitionDate}" required th:min="${T(java.time.LocalDate).now().plusDays(1)}">
            <span class="error" th:if="${#fields.hasErrors('requisitionDate')}" th:errors="*{requisitionDate}"></span>

            <button type="submit" class="button" th:text="${jobRequisition != null and jobRequisition.requisitionId != null ? 'Update Job Requisition' : 'Create Job Requisition'}">Create Job Requisition</button>
        </form>

        <a href="/jobRequisition/list" style="text-decoration: none;">
            <button class="button button-secondary">Back to Requisitions List</button>
        </a>
    </div>
</body>
</html>
