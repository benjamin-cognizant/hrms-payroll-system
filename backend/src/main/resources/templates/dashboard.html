<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payroll Management Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; }
        .card { border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: none; margin-bottom: 20px; }
        .card-header { background-color: #ffffff; border-bottom: 1px solid #e9ecef; font-weight: 700; color: #2c3e50; padding: 15px 20px;}
        .stat-value { font-size: 2rem; font-weight: 700; }
        .table th { font-size: 0.85rem; text-transform: uppercase; color: #6c757d; font-weight: 600; }
        .table td { vertical-align: middle; font-size: 0.95rem; }
        .money { font-family: 'Courier New', Courier, monospace; font-weight: 600; }
        .
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">Payroll Management System</h2>

        <form action="/dashboard" method="get" class="d-flex align-items-center bg-white p-2 rounded shadow-sm border">
            <label class="me-2 fw-bold text-secondary mb-0">Pay Period:</label>
            <input type="month" name="month"
                   class="form-control form-control-sm border-0 fw-bold text-primary"
                   th:value="${selectedMonth}"
                   onchange="this.form.submit()">
        </form>
    </div>

    <div class="row">
        <div class="col-lg-3 col-md-6">
            <div class="card p-4 h-100 border-start border-4 border-primary">
                <h6 class="text-muted text-uppercase mb-2">Total Gross Salary</h6>
                <div class="stat-value text-dark" th:text="'₹' + ${#numbers.formatDecimal(totalGross, 1, 'COMMA', 2, 'POINT')}">0.00</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="card p-4 h-100 border-start border-4 border-success">
                <h6 class="text-muted text-uppercase mb-2">Total Net Pay</h6>
                <div class="stat-value text-dark" th:text="'₹' + ${#numbers.formatDecimal(totalNetPay, 1, 'COMMA', 2, 'POINT')}">0.00</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="card p-4 h-100 border-start border-4 border-info">
                <h6 class="text-muted text-uppercase mb-2">Completed (Paid)</h6>
                <div class="stat-value text-dark" th:text="${paidCount}">0</div>
            </div>
        </div>

        <div class="col-lg-3 col-md-6">
            <div class="card p-4 h-100 border-start border-4 border-warning">
                <h6 class="text-muted text-uppercase mb-2">Pending</h6>
                <div class="stat-value text-dark" th:text="${pendingCount}">0</div>
            </div>
        </div>
    </div>

    <div class="card mt-2">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Monthly Payroll Details</span>
            <a href="/form" class="btn btn-sm btn-outline-primary">+ Run New Payroll</a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Payroll ID</th>
                        <th>Employee</th>
                        <th>Gross Salary</th>
                        <th class="text-danger">Total Deductions</th>
                        <th class="text-success">Net Pay</th>
                        <th class="pe-4 text-center">Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${payrolls}">
                        <td class="ps-4 fw-bold text-secondary" th:text="${p.payrollId}"></td>
                        <td class="fw-bold" th:text="${p.employee.name + ' (ID: ' + p.employee.id + ')'}"></td>
                        <td class="money text-muted" th:text="${p.grossSalary}"></td>
                        <td class="money text-danger" th:text="'-' + ${p.totalDeductions}"></td>
                        <td class="money text-success fw-bold" th:text="${p.netSalary}"></td>
                        <td class="pe-4 text-center">
                            <span class="badge"
                                  th:text="${p.status != null && p.status.name() == 'PAID' ? 'Completed' : 'Pending'}"
                                  th:classappend="${p.status != null && p.status.name() == 'PAID' ? 'bg-success' : 'bg-warning text-dark'}">
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
