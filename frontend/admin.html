<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — HRMS</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/employee.css" rel="stylesheet">
</head>

<body>

    <!-- Top Navbar -->
    <nav class="topnav">
        <div class="topnav-inner">
            <div class="brand">
                <div class="brand-icon"><i class="bi bi-shield-lock-fill"></i></div>
                <div>
                    <div class="brand-text">Cognizant HRMS</div>
                    <div class="brand-sub">Admin Portal</div>
                </div>
            </div>
            <div class="nav-tabs-hrms">
                <button class="nav-item active" onclick="showSection('employees', this)">
                    <i class="bi bi-people-fill"></i> Employees
                </button>
                <button class="nav-item" onclick="showSection('payroll', this)">
                    <i class="bi bi-cash-stack"></i> Payroll
                </button>
                <button class="nav-item" onclick="showSection('reports', this)">
                    <i class="bi bi-bar-chart-fill"></i> Reports
                </button>
            </div>
            <div class="user-chip">
                <div class="user-avatar">AD</div>
                <div>
                    <div class="user-name">Admin User</div>
                    <div class="user-role">Administrator</div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <div class="main">

        <!-- Employees Section -->
        <div class="section active" id="section-employees">
            <div class="card">
                <div class="card-head"><i class="bi bi-people-fill"></i>
                    <h6>Employee Directory</h6>
                </div>
                <div class="card-body-inner" style="padding:0;">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Designation</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                            <!-- Rows injected by adminApi.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Payroll Section -->
        <div class="section" id="section-payroll">
            <div class="card">
                <div class="card-head"><i class="bi bi-cash-stack"></i>
                    <h6>Payroll Overview</h6>
                </div>
                <div class="card-body-inner">
                    <div class="payslip-row">
                        <div>
                            <div class="payslip-period" id="payPeriod">June 2026</div>
                            <div style="font-size:0.75rem; color:#9ca3af;" id="payrollSummary">
                                Total Employees: ... | Processed: ...
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:14px;">
                            <span class="payslip-net" id="totalPayroll">₹0</span>
                            <span class="pill pill-processed" id="payrollStatus">Processing</span>
                            <button class="btn-sm-outline" onclick="toast('Generating payroll report…')">
                                <i class="bi bi-download me-1"></i>Download Report
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reports Section -->
        <div class="section" id="section-reports">
            <div class="card">
                <div class="card-head"><i class="bi bi-bar-chart-fill"></i>
                    <h6>HR Reports</h6>
                </div>
                <div class="card-body-inner">
                    <p id="reportOutput" style="font-size:0.85rem; color:#4b5563;">
                        Generate analytics on employee demographics, payroll trends, and leave statistics.
                    </p>
                    <button class="btn-primary-hrms" onclick="generateReport()">
                        <i class="bi bi-graph-up-arrow me-2"></i>Generate Report
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div class="toast-box" id="toastBox"></div>

    <script src="scripts/adminApi.js"></script>
</body>

</html>
