<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="css/payroll.css" rel="stylesheet">
    <link href="css/employee.css" rel="stylesheet">
</head>

<body>
    <!-- ══ TOP NAVBAR ══ -->
    <nav class="topnav">
        <div class="topnav-inner">
            <div class="brand">
                <div class="brand-icon"><i class="bi bi-shield-lock"></i></div>
                <div>
                    <div class="brand-text">Cognizant HRMS</div>
                    <div class="brand-sub">Admin Portal</div>
                </div>
            </div>
            <div class="user-chip">
                <div class="user-avatar">AD</div>
                <div>
                    <div class="user-name">Administrator</div>
                    <div class="user-role">System Admin</div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">

        <!-- Create New User Card -->
        <div class="card">
            <h2>Create New User</h2>
            <form id="createUserForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="loginname">Login Name</label>
                        <input type="text" id="loginname" name="loginname" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="role">Role</label>
                        <select id="role" name="role" required>
                            <option value="EMPLOYEE">Employee</option>
                            <option value="PAYROLL_OFFICER">Payroll Officer</option>
                            <option value="MANAGER">Manager</option>
                            <option value="HR_BUSINESS_PARTNER">HR Business Partner</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Create User</button>
                    </div>
                </div>
            </form>
        </div>

    </div>

    <!-- External JS -->
    <script src="scripts/admin.js"></script>
</body>

</html>
