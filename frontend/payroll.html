
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payroll Officer Dashboard</title>

<style>
body { font-family: Arial; margin: 0; background: #f4f6f9; }
header { background: #2f6fed; color: #fff; padding: 15px; text-align: center; }

.container { padding: 20px; }

.card {
  background: #fff;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

input, select, button {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
  border-radius: 5px;
}

button {
  background: #2f6fed;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover { background: #1e4fbf; }

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}

th { background: #2f6fed; color: white; }

.status {
  color: white;
  padding: 5px 10px;
  border-radius: 5px;
}

.paid { background: green; }
.pending { background: orange; }
</style>
</head>

<body>

<header>Payroll Officer Dashboard</header>

<div class="container">

  <!-- FORM -->
  <div class="card">
    <h3>Add Payroll Record</h3>

    <input type="text" id="payrollId" placeholder="Payroll ID">
    <input type="text" id="employeeId" placeholder="Employee ID">
    <input type="number" id="basicSalary" placeholder="Basic Salary">
    <input type="number" id="grossSalary" placeholder="Gross Salary">
    <input type="number" id="netSalary" placeholder="Net Salary">
    <input type="text" id="payPeriod" placeholder="Pay Period (e.g. June 2026)">

    <select id="status">
      <option value="Paid">Paid</option>
      <option value="Pending">Pending</option>
    </select>

    <button onclick="addPayroll()">Add Payroll</button>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>Payroll Records</h3>

    <table id="payrollTable">
      <thead>
        <tr>
          <th>Payroll ID</th>
          <th>Employee ID</th>
          <th>Basic Salary</th>
          <th>Gross Salary</th>
          <th>Net Salary</th>
          <th>Pay Period</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>

function addPayroll() {
  let payrollId = document.getElementById("payrollId").value;
  let employeeId = document.getElementById("employeeId").value;
  let basicSalary = document.getElementById("basicSalary").value;
  let grossSalary = document.getElementById("grossSalary").value;
  let netSalary = document.getElementById("netSalary").value;
  let payPeriod = document.getElementById("payPeriod").value;
  let status = document.getElementById("status").value;

  if (!payrollId || !employeeId || !basicSalary || !grossSalary || !netSalary || !payPeriod) {
    alert("Please fill all fields!");
    return;
  }

  let table = document.getElementById("payrollTable").getElementsByTagName('tbody')[0];
  let row = table.insertRow();

  row.innerHTML = `
    <td>${payrollId}</td>
    <td>${employeeId}</td>
    <td>₹${basicSalary}</td>
    <td>₹${grossSalary}</td>
    <td>₹${netSalary}</td>
    <td>${payPeriod}</td>
    <td><span class="status ${status.toLowerCase()}">${status}</span></td>
  `;

  // Clear fields
  document.getElementById("payrollId").value = "";
  document.getElementById("employeeId").value = "";
  document.getElementById("basicSalary").value = "";
  document.getElementById("grossSalary").value = "";
  document.getElementById("netSalary").value = "";
  document.getElementById("payPeriod").value = "";

}

</script>

</body>
</html>
