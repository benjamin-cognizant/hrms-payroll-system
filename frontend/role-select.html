<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role — HRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            margin: 16px;
        }

        .card-header {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            padding: 32px;
            text-align: center;
            color: white;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 1.8rem;
            border: 2px solid rgba(255,255,255,0.25);
        }

        .card-header h4 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .card-header p {
            font-size: 0.83rem;
            opacity: 0.8;
        }

        .card-body {
            padding: 32px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            color: #374151;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 0.9rem;
            color: #374151;
            background: #fff;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus {
            border-color: #3949ab;
            box-shadow: 0 0 0 3px rgba(57,73,171,0.12);
        }

        .card-footer {
            text-align: center;
            padding: 14px 32px 22px;
            font-size: 0.82rem;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
        }

        .card-footer a {
            color: #3949ab;
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">

    <div class="card-header">
        <div class="logo-icon">
            <i class="bi bi-people-fill"></i>
        </div>
        <h4>Select Your Role</h4>
        <p>HR Management System — Cognizant</p>
    </div>

    <div class="card-body">
        <label for="roleSelect">
            <i class="bi bi-person-badge-fill" style="color:#3949ab; margin-right:5px;"></i>Role
        </label>
        <select id="roleSelect" onchange="goToLogin(this.value)">
            <option value="">— Choose a role —</option>
            <option value="HR Recruiter">HR Recruiter</option>
            <option value="HR Business Partner">HR Business Partner</option>
            <option value="Manager">Manager</option>
            <option value="Employee">Employee</option>
            <option value="Payroll Officer">Payroll Officer</option>
            <option value="Admin">Admin</option>
        </select>
    </div>

    <div class="card-footer">
        <a href="login.html"><i class="bi bi-arrow-left" style="margin-right:4px;"></i>Back to Login</a>
        &nbsp;·&nbsp; &copy; 2026 Cognizant HRMS
    </div>

</div>

<script>
    function goToLogin(role) {
        if (role) window.location.href = 'login.html?role=' + encodeURIComponent(role);
    }
</script>
</body>
</html>
