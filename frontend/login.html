<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, .brand-title { font-family: 'Poppins', sans-serif; }


        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 16px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            padding: 36px 32px 28px;
            text-align: center;
            color: white;
        }

        .login-header .logo-icon {
            width: 68px;
            height: 68px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem;
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.25);
        }

        .login-header h4 {
            font-size: 1.4rem;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .login-header p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin: 0;
        }

        .login-body {
            padding: 32px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: #3949ab;
            box-shadow: 0 0 0 3px rgba(57, 73, 171, 0.12);
        }

        .input-group .form-control { border-radius: 10px 0 0 10px !important; }
        .input-group .btn-toggle    { border-radius: 0 10px 10px 0 !important; }

        .btn-toggle {
            border: 1.5px solid #e5e7eb;
            border-left: none;
            background: #f9fafb;
            color: #6b7280;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-toggle:hover { background: #f3f4f6; }

        .btn-login {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-login:hover  { opacity: 0.92; transform: translateY(-1px); color: white; }
        .btn-login:active { transform: translateY(0); }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9ca3af;
            font-size: 0.8rem;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .demo-creds {
            background: #f0f4ff;
            border: 1px solid #c7d2fe;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.82rem;
            color: #3730a3;
        }

        .demo-creds strong { color: #1a237e; }

        .login-footer {
            text-align: center;
            padding: 16px 32px 24px;
            font-size: 0.82rem;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
        }

        .login-footer a { color: #3949ab; text-decoration: none; font-weight: 500; }
        .login-footer a:hover { text-decoration: underline; }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85rem;
            display: none;
            margin-bottom: 16px;
        }

        .spinner-border-sm { width: 1rem; height: 1rem; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="login-header">
            <div class="logo-icon">
                <i class="bi bi-people-fill"></i>
            </div>
            
            <p>HR Management System — Cognizant</p>
        </div>

        <div class="login-body">

            <div class="error-box" id="errorBox">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <span id="errorMsg">Invalid username or password.</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">

                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-person-fill me-1 text-primary"></i>Username
                    </label>
                    <input type="text" class="form-control" id="username"
                           placeholder="Enter your username" autocomplete="username" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        <i class="bi bi-lock-fill me-1 text-primary"></i>Password
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password"
                               placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="btn-toggle" onclick="togglePassword()" id="toggleBtn" title="Show/Hide">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted" style="font-size:0.85rem;" for="rememberMe">
                            Remember me
                        </label>
                    </div>
                    <a href="#" class="text-primary" style="font-size:0.85rem; text-decoration:none; font-weight:500;">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                    <span id="btnSpinner" class="d-none">
                        <span class="spinner-border spinner-border-sm me-2"></span>Signing in...
                    </span>
                </button>

            </form>

            <div class="divider">Demo Credentials</div>

            <div class="demo-creds">
                <div class="mb-1"><strong>Username:</strong> recruiter</div>
                <div><strong>Password:</strong> hrms@2026</div>
            </div>

        </div>

       
        <div class="login-footer">
            <a href="home.html"><i class="bi bi-house-fill me-1"></i>Back to Home</a>
            &nbsp;·&nbsp; &copy; 2026 Cognizant HRMS
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  
    // ── Dummy credentials ──────────────
    const VALID_USERS = [
        { username: 'recruiter',  password: 'hrms@2026',  name: 'Recruiter' },
        { username: 'admin',      password: 'admin@2026', name: 'Admin'     }
    ];

    // ── Login handler ─────────────────────────────────────────────────────
    function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        setLoading(true);
        hideError();

        // Simulate checking the system
        setTimeout(() => {
            const user = VALID_USERS.find(u => u.username === username && u.password === password);

            if (user) {
                // The ID is good! 
                // 1. Stop the loading spinner
                setLoading(false);
                // 2. Show the success pop-up
                alert('Successful login!');
                // 3. Clear the form so it is blank again
                document.getElementById('loginForm').reset();
            } else {
                // The ID is bad!
                setLoading(false);
                showError('Invalid username or password. Please try again.');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }, 900);
    }

    // ── Toggle password visibility ────────────────────────────────────────
    function togglePassword() {
        const pwd  = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            pwd.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    // ── Helpers ───────────────────────────────────────────────────────────
    function setLoading(state) {
        document.getElementById('btnText').classList.toggle('d-none', state);
        document.getElementById('btnSpinner').classList.toggle('d-none', !state);
        document.getElementById('loginBtn').disabled = state;
    }

    function showError(msg) {
        document.getElementById('errorMsg').textContent = msg;
        document.getElementById('errorBox').style.display = 'block';
    }

    function hideError() {
        document.getElementById('errorBox').style.display = 'none';
    }
    
    // Notice: I completely removed the code at the bottom that automatically 
    // pushed the user to another page if they were already logged in. 
    // Now it is just a pure UI testing page!
</script>
</body>
</html>
