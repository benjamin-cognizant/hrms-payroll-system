<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — HRMS</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="employee.css" rel="stylesheet">
</head>

<body>

    <!-- Shared Navbar -->
    <nav class="topnav">
        <div class="topnav-inner">
            <div class="brand">
                <div class="brand-icon"><i class="bi bi-people-fill"></i></div>
                <div>
                    <div class="brand-text">Cognizant HRMS</div>
                    <div class="brand-sub">Employee Portal</div>
                </div>
            </div>
            <div class="nav-tabs-hrms">
                <a href="profile.html" class="nav-item active"><i class="bi bi-person-circle"></i> My Profile</a>
                <a href="attendance.html" class="nav-item"><i class="bi bi-calendar-check"></i> Attendance & Leave</a>
                <a href="payslip.html" class="nav-item"><i class="bi bi-receipt"></i> My Payslips</a>
                <a href="appraisal.html" class="nav-item"><i class="bi bi-star-half"></i> My Appraisal</a>
            </div>
            <div class="user-chip">
                <div class="user-avatar">JD</div>
                <div>
                    <div class="user-name">John Doe</div>
                    <div class="user-role">Employee</div>
                </div>
            </div>
        </div>
    </nav>

    <div class="main">
        <div class="topbar">
            <h4 class="page-title">My Profile</h4>
            <div class="page-subtitle">Your personal details and employment information</div>
        </div>

        <div class="card">
            <div class="card-head"><i class="bi bi-person-badge"></i>
                <h6>Employment Details</h6>
            </div>
            <div class="card-body-inner">
                <div class="profile-grid">
                    <div class="profile-field"><label>Employee ID</label><span>EMP-10045</span></div>
                    <div class="profile-field"><label>Full Name</label><span>John Doe</span></div>
                    <div class="profile-field"><label>Department</label><span>Engineering</span></div>
                    <div class="profile-field"><label>Designation</label><span>Software Engineer</span></div>
                    <div class="profile-field"><label>Manager</label><span>Sarah Chen</span></div>
                    <div class="profile-field"><label>Status</label><span class="badge-status">Active</span></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-box" id="toastBox"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="employee.js"></script>
</body>

</html>
