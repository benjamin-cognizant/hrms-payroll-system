<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — HRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #3949ab 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
            margin: 16px;
            text-align: center;
        }

        .card-header {
            background: linear-gradient(135deg, #1a237e, #3949ab);
            padding: 32px;
            color: white;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 1.8rem;
            border: 2px solid rgba(255,255,255,0.25);
        }

        .card-header h4 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .card-header p {
            font-size: 0.83rem;
            opacity: 0.8;
        }

        .card-body {
            padding: 36px 32px;
        }

        .welcome-text {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .role-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 16px;
        }

        .dummy-note {
            background: #f0f4ff;
            border: 1px solid #c7d2fe;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.83rem;
            color: #3730a3;
        }

        .card-footer {
            text-align: center;
            padding: 14px 32px 22px;
            font-size: 0.82rem;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
        }

        .card-footer a {
            color: #3949ab;
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">

    <div class="card-header">
        <div class="logo-icon">
            <i class="bi bi-speedometer2"></i>
        </div>
        <h4>Dashboard</h4>
        <p>HR Management System — Cognizant</p>
    </div>

    <div class="card-body">
        <p class="welcome-text">You are logged in as</p>
        <div class="role-name" id="roleName">—</div>
        <div class="dummy-note">
            <i class="bi bi-info-circle-fill" style="margin-right:6px;"></i>
            This is a dummy dashboard page for the <strong id="roleNameInline">—</strong> role.
        </div>
    </div>

    <div class="card-footer">
        <a href="role-select.html"><i class="bi bi-arrow-left" style="margin-right:4px;"></i>Back to Role Select</a>
        &nbsp;·&nbsp; &copy; 2026 Cognizant HRMS
    </div>

</div>

<script>
    const role = new URLSearchParams(window.location.search).get('role') || 'User';
    document.getElementById('roleName').textContent = role;
    document.getElementById('roleNameInline').textContent = role;
</script>
</body>
</html>
